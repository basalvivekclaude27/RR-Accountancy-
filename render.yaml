services:
  - type: web
    name: rr-accountancy-app
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: rr-accountancy-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: rr-accountancy-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: rr-accountancy-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: rr-accountancy-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: rr-accountancy-db
          property: password

databases:
  - name: rr-accountancy-db
    plan: free
    databaseName: rr_accountancy
    user: rr_admin
