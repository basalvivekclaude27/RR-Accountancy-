services:
  db:
    image: postgres:16-alpine
    container_name: rr-accountancy-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-rr_accountancy_db}
      POSTGRES_USER: ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_HOST_PORT:-5433}:5432"
    volumes:
      - rr_accountancy_db_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-admin} -d ${DB_NAME:-rr_accountancy_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - rr-accountancy-net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rr-accountancy-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-rr_accountancy_db}
      DB_USER: ${DB_USER:-admin}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      PORT: 7000
    ports:
      - "${APP_HOST_PORT:-7005}:7000"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/7000' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - rr-accountancy-net

networks:
  rr-accountancy-net:
    driver: bridge

volumes:
  rr_accountancy_db_data:
    driver: local
