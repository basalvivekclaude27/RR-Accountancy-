server:
  port: ${PORT:7000}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
  error:
    whitelabel:
      enabled: false

spring:
  application:
    name: rr-accountancy-app
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:DataEngineering}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  thymeleaf:
    cache: false

app:
  admin:
    default-username: admin
    default-password: Basal123$

logging:
  level:
    org.springframework.security: INFO
    com.rraccountancy: DEBUG
