<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${formTitle})}"></head>
<body class="dashboard-body">

<div class="app-shell">

    <aside th:replace="~{fragments/sidebar :: sidebar('service-charge')}"></aside>

    <div class="app-main">
        <header th:replace="~{fragments/topbar :: topbar('Service Charge Accounts')}"></header>

        <main class="content">
            <section class="form-card">
                <div class="form-card-head">
                    <div>
                        <h1 class="page-title" th:text="${formTitle}">New Service Charge Account</h1>
                        <p class="page-sub">
                            <a th:href="@{/service-charge}"><i class="bi bi-arrow-left"></i> Back to Service Charge Accounts</a>
                        </p>
                    </div>
                </div>

                <form th:action="@{${formAction}}" th:object="${accountForm}" method="post" class="job-form" novalidate>

                    <div class="job-form-grid">
                        <div class="field-block">
                            <label for="propertyName">Property / Development Name</label>
                            <input type="text" id="propertyName" th:field="*{propertyName}" placeholder="e.g. Maple Court"/>
                            <div class="field-error" th:if="${#fields.hasErrors('propertyName')}" th:errors="*{propertyName}"></div>
                        </div>

                        <div class="field-block">
                            <label for="propertyRef">Account Reference</label>
                            <input type="text" id="propertyRef" th:field="*{propertyRef}" placeholder="Auto-generated if left blank"/>
                            <div class="field-error" th:if="${#fields.hasErrors('propertyRef')}" th:errors="*{propertyRef}"></div>
                        </div>

                        <div class="field-block">
                            <label for="units">Unit(s)</label>
                            <input type="number" id="units" th:field="*{units}" min="1" placeholder="e.g. 24"/>
                            <div class="field-error" th:if="${#fields.hasErrors('units')}" th:errors="*{units}"></div>
                        </div>

                        <div class="field-block">
                            <label for="financialYearStart">Financial Year (start)</label>
                            <input type="number" id="financialYearStart" th:field="*{financialYearStart}" placeholder="e.g. 2024" min="2000" max="2100"/>
                            <div class="field-error" th:if="${#fields.hasErrors('financialYearStart')}" th:errors="*{financialYearStart}"></div>
                        </div>

                        <div class="field-block">
                            <label for="period">Period</label>
                            <input type="month" id="period" th:field="*{period}"/>
                            <div class="field-error" th:if="${#fields.hasErrors('period')}" th:errors="*{period}"></div>
                        </div>

                        <div class="field-block">
                            <label for="budgetedAmount">Budgeted Amount (£)</label>
                            <input type="number" id="budgetedAmount" th:field="*{budgetedAmount}" step="0.01" min="0" placeholder="e.g. 18600"/>
                            <div class="field-error" th:if="${#fields.hasErrors('budgetedAmount')}" th:errors="*{budgetedAmount}"></div>
                        </div>

                        <div class="field-block">
                            <label for="collectedAmount">Collected Amount (£)</label>
                            <input type="number" id="collectedAmount" th:field="*{collectedAmount}" step="0.01" min="0" placeholder="e.g. 15680"/>
                            <div class="field-error" th:if="${#fields.hasErrors('collectedAmount')}" th:errors="*{collectedAmount}"></div>
                        </div>

                        <div class="field-block">
                            <label for="status">Status</label>
                            <select id="status" th:field="*{status}">
                                <option value="">Select status</option>
                                <option th:each="s : ${statuses}" th:value="${s}" th:text="${s.label}"></option>
                            </select>
                            <div class="field-error" th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></div>
                        </div>
                    </div>

                    <div class="job-form-actions">
                        <a th:href="@{/service-charge}" class="btn-reset">Cancel</a>
                        <button type="submit" class="btn-apply"><i class="bi bi-check-lg"></i> Save Account</button>
                    </div>
                </form>
            </section>
        </main>

        <footer class="app-footer">
            <span class="footer-diamond">&#10022;</span>
            <span class="footer-text">Reliable. Professional. Personal. Your Financial Success is Our Priority.</span>
            <span class="footer-diamond">&#10022;</span>
        </footer>
    </div>
</div>

<script th:src="@{/js/dashboard.js}"></script>
</body>
</html>
