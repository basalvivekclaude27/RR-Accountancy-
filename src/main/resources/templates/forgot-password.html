<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Forgot Password')}"></head>
<body>
<div class="auth-shell">
    <div class="auth-header">
        <h1>Forgot Your Password?</h1>
        <p>Reach out to your administrator to reset access</p>
    </div>
    <div class="register-wrap">
        <section class="auth-card admin" style="min-height:auto;">
            <div class="form-panel" style="flex:1 1 100%; margin:16px;">
                <h2>Need a reset?</h2>
                <p class="form-sub">
                    Self-service password reset isn't available yet. Please contact your
                    R &amp; R Accountancy Services administrator and they will help you regain access to your account.
                </p>
                <a th:href="@{/login}" class="btn-submit text-decoration-none">
                    <i class="bi bi-arrow-left"></i> Back to Sign In
                </a>
            </div>
        </section>
    </div>
</div>
</body>
</html>
