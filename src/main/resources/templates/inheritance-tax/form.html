<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${formTitle})}"></head>
<body class="dashboard-body">

<div class="app-shell">

    <aside th:replace="~{fragments/sidebar :: sidebar('inheritance-tax')}"></aside>

    <div class="app-main">
        <header th:replace="~{fragments/topbar :: topbar('Inheritance Tax')}"></header>

        <main class="content">
            <section class="form-card">
                <div class="form-card-head">
                    <div>
                        <h1 class="page-title" th:text="${formTitle}">New IHT Enquiry</h1>
                        <p class="page-sub">
                            <a th:href="@{/inheritance-tax}"><i class="bi bi-arrow-left"></i> Back to Inheritance Tax</a>
                        </p>
                    </div>
                </div>

                <form th:action="@{${formAction}}" th:object="${caseForm}" method="post" class="job-form" novalidate>

                    <div class="job-form-grid">
                        <div class="field-block">
                            <label for="clientName">Client Name</label>
                            <input type="text" id="clientName" th:field="*{clientName}" placeholder="e.g. John Miller"/>
                            <div class="field-error" th:if="${#fields.hasErrors('clientName')}" th:errors="*{clientName}"></div>
                        </div>

                        <div class="field-block">
                            <label for="utr">UTR (10 digits)</label>
                            <input type="text" id="utr" th:field="*{utr}" placeholder="e.g. 1234567890" maxlength="10"/>
                            <div class="field-error" th:if="${#fields.hasErrors('utr')}" th:errors="*{utr}"></div>
                        </div>

                        <div class="field-block">
                            <label for="clientType">Client Type</label>
                            <input type="text" id="clientType" th:field="*{clientType}" placeholder="e.g. Individual"/>
                            <div class="field-error" th:if="${#fields.hasErrors('clientType')}" th:errors="*{clientType}"></div>
                        </div>

                        <div class="field-block">
                            <label for="planningType">Planning / Report Type</label>
                            <input type="text" id="planningType" th:field="*{planningType}" placeholder="e.g. IHT Return"/>
                            <div class="field-error" th:if="${#fields.hasErrors('planningType')}" th:errors="*{planningType}"></div>
                        </div>

                        <div class="field-block">
                            <label for="taxYearStart">Tax Year Start</label>
                            <input type="number" id="taxYearStart" th:field="*{taxYearStart}" placeholder="e.g. 2024" min="2000" max="2100"/>
                            <div class="field-error" th:if="${#fields.hasErrors('taxYearStart')}" th:errors="*{taxYearStart}"></div>
                        </div>

                        <div class="field-block">
                            <label for="estateValue">Estate Value (£)</label>
                            <input type="number" id="estateValue" th:field="*{estateValue}" step="0.01" placeholder="e.g. 1250000"/>
                            <div class="field-error" th:if="${#fields.hasErrors('estateValue')}" th:errors="*{estateValue}"></div>
                        </div>

                        <div class="field-block">
                            <label for="nilRateBandAvailable">Nil Rate Band Available (£)</label>
                            <input type="number" id="nilRateBandAvailable" th:field="*{nilRateBandAvailable}" step="0.01" placeholder="e.g. 325000"/>
                            <div class="field-error" th:if="${#fields.hasErrors('nilRateBandAvailable')}" th:errors="*{nilRateBandAvailable}"></div>
                        </div>

                        <div class="field-block">
                            <label for="taxLiability">Est. Tax Liability (£)</label>
                            <input type="number" id="taxLiability" th:field="*{taxLiability}" step="0.01" min="0" placeholder="e.g. 185000"/>
                            <div class="field-error" th:if="${#fields.hasErrors('taxLiability')}" th:errors="*{taxLiability}"></div>
                        </div>

                        <div class="field-block">
                            <label for="status">Status</label>
                            <select id="status" th:field="*{status}">
                                <option value="">Select status</option>
                                <option th:each="s : ${statuses}" th:value="${s}" th:text="${s.label}"></option>
                            </select>
                            <div class="field-error" th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></div>
                        </div>

                        <div class="field-block">
                            <label for="assignedTo">Assigned To</label>
                            <input type="text" id="assignedTo" th:field="*{assignedTo}" placeholder="Staff member name"/>
                            <div class="field-error" th:if="${#fields.hasErrors('assignedTo')}" th:errors="*{assignedTo}"></div>
                        </div>
                    </div>

                    <div class="job-form-actions">
                        <a th:href="@{/inheritance-tax}" class="btn-reset">Cancel</a>
                        <button type="submit" class="btn-apply"><i class="bi bi-check-lg"></i> Save Case</button>
                    </div>
                </form>
            </section>
        </main>

        <footer class="app-footer">
            <span class="footer-diamond">&#10022;</span>
            <span class="footer-text">Reliable. Professional. Personal. Your Financial Success is Our Priority.</span>
            <span class="footer-diamond">&#10022;</span>
        </footer>
    </div>
</div>

<script th:src="@{/js/dashboard.js}"></script>
</body>
</html>
