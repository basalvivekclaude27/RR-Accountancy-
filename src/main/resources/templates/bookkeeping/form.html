<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${formTitle})}"></head>
<body class="dashboard-body">

<div class="app-shell">

    <aside th:replace="~{fragments/sidebar :: sidebar('bookkeeping')}"></aside>

    <div class="app-main">
        <header th:replace="~{fragments/topbar :: topbar('Bookkeeping')}"></header>

        <main class="content">
            <section class="form-card">
                <div class="form-card-head">
                    <div>
                        <h1 class="page-title" th:text="${formTitle}">New Bookkeeping Job</h1>
                        <p class="page-sub">
                            <a th:href="@{/bookkeeping}"><i class="bi bi-arrow-left"></i> Back to Bookkeeping Jobs</a>
                        </p>
                    </div>
                </div>

                <form th:action="@{${formAction}}" th:object="${jobForm}" method="post" class="job-form" novalidate>

                    <div class="job-form-grid">
                        <div class="field-block">
                            <label for="clientName">Client / Business Name</label>
                            <input type="text" id="clientName" th:field="*{clientName}" placeholder="e.g. ABC Solutions Ltd."/>
                            <div class="field-error" th:if="${#fields.hasErrors('clientName')}" th:errors="*{clientName}"></div>
                        </div>

                        <div class="field-block">
                            <label for="invoiceRef">Invoice Reference</label>
                            <input type="text" id="invoiceRef" th:field="*{invoiceRef}" placeholder="Auto-generated if left blank"/>
                            <div class="field-error" th:if="${#fields.hasErrors('invoiceRef')}" th:errors="*{invoiceRef}"></div>
                        </div>

                        <div class="field-block">
                            <label for="period">Period</label>
                            <input type="month" id="period" th:field="*{period}"/>
                            <div class="field-error" th:if="${#fields.hasErrors('period')}" th:errors="*{period}"></div>
                        </div>

                        <div class="field-block">
                            <label for="category">Category</label>
                            <select id="category" th:field="*{category}">
                                <option value="">Select category</option>
                                <option th:each="cat : ${categories}" th:value="${cat}" th:text="${cat.label}"></option>
                            </select>
                            <div class="field-error" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></div>
                        </div>

                        <div class="field-block">
                            <label for="status">Status</label>
                            <select id="status" th:field="*{status}">
                                <option value="">Select status</option>
                                <option th:each="s : ${statuses}" th:value="${s}" th:text="${s.label}"></option>
                            </select>
                            <div class="field-error" th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></div>
                        </div>

                        <div class="field-block">
                            <label for="assignedTo">Assigned To</label>
                            <input type="text" id="assignedTo" th:field="*{assignedTo}" placeholder="Staff member name"/>
                            <div class="field-error" th:if="${#fields.hasErrors('assignedTo')}" th:errors="*{assignedTo}"></div>
                        </div>
                    </div>

                    <div class="job-form-actions">
                        <a th:href="@{/bookkeeping}" class="btn-reset">Cancel</a>
                        <button type="submit" class="btn-apply"><i class="bi bi-check-lg"></i> Save Job</button>
                    </div>
                </form>
            </section>
        </main>

        <footer class="app-footer">
            <span class="footer-diamond">&#10022;</span>
            <span class="footer-text">Reliable. Professional. Personal. Your Financial Success is Our Priority.</span>
            <span class="footer-diamond">&#10022;</span>
        </footer>
    </div>
</div>

<script th:src="@{/js/dashboard.js}"></script>
</body>
</html>
