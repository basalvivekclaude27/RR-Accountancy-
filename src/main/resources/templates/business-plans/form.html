<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${formTitle})}"></head>
<body class="dashboard-body">

<div class="app-shell">

    <aside th:replace="~{fragments/sidebar :: sidebar('business-plans')}"></aside>

    <div class="app-main">
        <header th:replace="~{fragments/topbar :: topbar('Business Plans')}"></header>

        <main class="content">
            <section class="form-card">
                <div class="form-card-head">
                    <div>
                        <h1 class="page-title" th:text="${formTitle}">New Business Plan</h1>
                        <p class="page-sub">
                            <a th:href="@{/business-plans}"><i class="bi bi-arrow-left"></i> Back to Business Plans</a>
                        </p>
                    </div>
                </div>

                <form th:action="@{${formAction}}" th:object="${planForm}" method="post" class="job-form" novalidate>

                    <div class="job-form-grid">
                        <div class="field-block">
                            <label for="clientName">Client Name</label>
                            <input type="text" id="clientName" th:field="*{clientName}" placeholder="e.g. John Miller"/>
                            <div class="field-error" th:if="${#fields.hasErrors('clientName')}" th:errors="*{clientName}"></div>
                        </div>

                        <div class="field-block">
                            <label for="planRef">Plan Reference</label>
                            <input type="text" id="planRef" th:field="*{planRef}" placeholder="Auto-generated if left blank"/>
                            <div class="field-error" th:if="${#fields.hasErrors('planRef')}" th:errors="*{planRef}"></div>
                        </div>

                        <div class="field-block">
                            <label for="planName">Plan Name</label>
                            <input type="text" id="planName" th:field="*{planName}" placeholder="e.g. 5 Year Growth Plan"/>
                            <div class="field-error" th:if="${#fields.hasErrors('planName')}" th:errors="*{planName}"></div>
                        </div>

                        <div class="field-block">
                            <label for="planType">Plan Type</label>
                            <input type="text" id="planType" th:field="*{planType}" placeholder="e.g. Growth Plan"/>
                            <div class="field-error" th:if="${#fields.hasErrors('planType')}" th:errors="*{planType}"></div>
                        </div>

                        <div class="field-block">
                            <label for="industry">Industry</label>
                            <input type="text" id="industry" th:field="*{industry}" placeholder="e.g. Technology"/>
                            <div class="field-error" th:if="${#fields.hasErrors('industry')}" th:errors="*{industry}"></div>
                        </div>

                        <div class="field-block">
                            <label for="status">Status</label>
                            <select id="status" th:field="*{status}">
                                <option value="">Select status</option>
                                <option th:each="s : ${statuses}" th:value="${s}" th:text="${s.label}"></option>
                            </select>
                            <div class="field-error" th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></div>
                        </div>

                        <div class="field-block">
                            <label for="revenuePotential">Revenue Potential (£)</label>
                            <input type="number" id="revenuePotential" th:field="*{revenuePotential}" step="0.01" min="0" placeholder="e.g. 450000"/>
                            <div class="field-error" th:if="${#fields.hasErrors('revenuePotential')}" th:errors="*{revenuePotential}"></div>
                        </div>
                    </div>

                    <div class="job-form-actions">
                        <a th:href="@{/business-plans}" class="btn-reset">Cancel</a>
                        <button type="submit" class="btn-apply"><i class="bi bi-check-lg"></i> Save Plan</button>
                    </div>
                </form>
            </section>
        </main>

        <footer class="app-footer">
            <span class="footer-diamond">&#10022;</span>
            <span class="footer-text">Reliable. Professional. Personal. Your Financial Success is Our Priority.</span>
            <span class="footer-diamond">&#10022;</span>
        </footer>
    </div>
</div>

<script th:src="@{/js/dashboard.js}"></script>
</body>
</html>
