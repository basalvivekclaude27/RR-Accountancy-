<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Access Denied')}"></head>
<body>
<div class="auth-shell">
    <div class="auth-header">
        <h1><i class="bi bi-shield-exclamation" style="color:#B42318;"></i> Access Denied</h1>
        <p>You don't have permission to view this page.</p>
    </div>
    <div class="register-wrap">
        <a th:href="@{/login}" class="btn-submit text-decoration-none" style="background:var(--navy);">
            <i class="bi bi-arrow-left"></i> Back to Sign In
        </a>
    </div>
</div>
</body>
</html>
