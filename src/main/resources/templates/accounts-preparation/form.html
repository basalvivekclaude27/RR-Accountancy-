<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${formTitle})}"></head>
<body class="dashboard-body">

<div class="app-shell">

    <aside th:replace="~{fragments/sidebar :: sidebar('accounts-preparation')}"></aside>

    <div class="app-main">
        <header th:replace="~{fragments/topbar :: topbar('Accounts Preparation')}"></header>

        <main class="content">
            <section class="form-card">
                <div class="form-card-head">
                    <div>
                        <h1 class="page-title" th:text="${formTitle}">New Accounts Preparation Job</h1>
                        <p class="page-sub">
                            <a th:href="@{/accounts-preparation}"><i class="bi bi-arrow-left"></i> Back to Accounts Preparation Jobs</a>
                        </p>
                    </div>
                </div>

                <form th:action="@{${formAction}}" th:object="${jobForm}" method="post" class="job-form" novalidate>

                    <div class="job-form-grid">
                        <div class="field-block">
                            <label for="clientName">Client / Business Name</label>
                            <input type="text" id="clientName" th:field="*{clientName}" placeholder="e.g. ABC Solutions Ltd."/>
                            <div class="field-error" th:if="${#fields.hasErrors('clientName')}" th:errors="*{clientName}"></div>
                        </div>

                        <div class="field-block">
                            <label for="jobRef">Job Reference</label>
                            <input type="text" id="jobRef" th:field="*{jobRef}" placeholder="Auto-generated if left blank"/>
                            <div class="field-error" th:if="${#fields.hasErrors('jobRef')}" th:errors="*{jobRef}"></div>
                        </div>

                        <div class="field-block">
                            <label for="financialYearStart">Financial Year (start)</label>
                            <input type="number" id="financialYearStart" th:field="*{financialYearStart}" placeholder="e.g. 2024" min="2000" max="2100"/>
                            <div class="field-error" th:if="${#fields.hasErrors('financialYearStart')}" th:errors="*{financialYearStart}"></div>
                        </div>

                        <div class="field-block">
                            <label for="accountType">Account Type</label>
                            <select id="accountType" th:field="*{accountType}">
                                <option value="">Select account type</option>
                                <option th:each="t : ${accountTypes}" th:value="${t}" th:text="${t.label}"></option>
                            </select>
                            <div class="field-error" th:if="${#fields.hasErrors('accountType')}" th:errors="*{accountType}"></div>
                        </div>

                        <div class="field-block">
                            <label for="status">Status</label>
                            <select id="status" th:field="*{status}">
                                <option value="">Select status</option>
                                <option th:each="s : ${statuses}" th:value="${s}" th:text="${s.label}"></option>
                            </select>
                            <div class="field-error" th:if="${#fields.hasErrors('status')}" th:errors="*{status}"></div>
                        </div>

                        <div class="field-block">
                            <label for="assignedTo">Assigned To</label>
                            <input type="text" id="assignedTo" th:field="*{assignedTo}" placeholder="Staff member name"/>
                            <div class="field-error" th:if="${#fields.hasErrors('assignedTo')}" th:errors="*{assignedTo}"></div>
                        </div>
                    </div>

                    <div class="job-form-actions">
                        <a th:href="@{/accounts-preparation}" class="btn-reset">Cancel</a>
                        <button type="submit" class="btn-apply"><i class="bi bi-check-lg"></i> Save Job</button>
                    </div>
                </form>
            </section>
        </main>

        <footer class="app-footer">
            <span class="footer-diamond">&#10022;</span>
            <span class="footer-text">Reliable. Professional. Personal. Your Financial Success is Our Priority.</span>
            <span class="footer-diamond">&#10022;</span>
        </footer>
    </div>
</div>

<script th:src="@{/js/dashboard.js}"></script>
</body>
</html>
