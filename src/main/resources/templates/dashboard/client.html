<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Client Dashboard')}"></head>
<body>
<nav class="navbar navbar-dark px-4" style="background: var(--client-accent);">
    <span class="navbar-brand"><i class="bi bi-person-workspace me-2"></i>R &amp; R Accountancy — My Account</span>
    <form th:action="@{/logout}" method="post" class="d-flex mb-0">
        <button type="submit" class="btn btn-outline-light btn-sm">
            <i class="bi bi-box-arrow-right me-1"></i> Logout
        </button>
    </form>
</nav>

<div class="container">
    <div class="dash-hero">
        <h2 class="mb-1">Welcome back, <span th:text="${fullName}">Client</span></h2>
        <p class="text-muted mb-0">Access your records and stay on top of your accounts.</p>
    </div>
</div>
</body>
</html>
