<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Tax Return Detail')}"></head>
<body class="dashboard-body">

<div class="app-shell">

    <aside th:replace="~{fragments/sidebar :: sidebar('personal-income-tax')}"></aside>

    <div class="app-main">
        <header th:replace="~{fragments/topbar :: topbar('Personal Income Tax')}"></header>

        <main class="content">
            <section class="form-card">
                <div class="form-card-head">
                    <div>
                        <h1 class="page-title" th:text="${taxReturn.clientName}">Client Name</h1>
                        <p class="page-sub">
                            <a th:href="@{/personal-income-tax}"><i class="bi bi-arrow-left"></i> Back to Tax Returns</a>
                        </p>
                    </div>
                    <a th:href="@{/personal-income-tax/{id}/edit(id=${taxReturn.id})}" class="btn-primary-navy">
                        <i class="bi bi-pencil"></i> Edit Return
                    </a>
                </div>

                <dl class="detail-grid">
                    <div class="detail-item">
                        <dt>UTR</dt>
                        <dd th:text="${taxReturn.utr}">1234567890</dd>
                    </div>
                    <div class="detail-item">
                        <dt>Client Type</dt>
                        <dd th:text="${taxReturn.clientType}">Individual</dd>
                    </div>
                    <div class="detail-item">
                        <dt>Tax Year</dt>
                        <dd th:text="${taxReturn.taxYearLabel}">2024 - 2025</dd>
                    </div>
                    <div class="detail-item">
                        <dt>Status</dt>
                        <dd><span class="status-pill" th:classappend="'pill-' + ${taxReturn.status}" th:text="${taxReturn.status.label}">Status</span></dd>
                    </div>
                    <div class="detail-item">
                        <dt>Refund / (Payable)</dt>
                        <dd th:text="${taxReturn.refundLabel}"
                            th:style="${taxReturn.refund ? 'color:#16A34A;font-weight:600;' : (taxReturn.payable ? 'color:#E2564F;font-weight:600;' : 'color:#9AA7BC;')}">+£3,250</dd>
                    </div>
                    <div class="detail-item">
                        <dt>Assigned To</dt>
                        <dd th:text="${taxReturn.assignedTo}">Staff</dd>
                    </div>
                    <div class="detail-item">
                        <dt>Last Updated</dt>
                        <dd th:text="${taxReturn.lastUpdatedLabel}">08 Aug 2025</dd>
                    </div>
                </dl>
            </section>
        </main>

        <footer class="app-footer">
            <span class="footer-diamond">&#10022;</span>
            <span class="footer-text">Reliable. Professional. Personal. Your Financial Success is Our Priority.</span>
            <span class="footer-diamond">&#10022;</span>
        </footer>
    </div>
</div>

<script th:src="@{/js/dashboard.js}"></script>
</body>
</html>
